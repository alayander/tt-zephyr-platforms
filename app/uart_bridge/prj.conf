# SPDX-License-Identifier: Apache-2.0

# Interrupt-driven serial for a low-latency, lossless byte bridge.
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y

# The host UART (usart1) is the ST-Link VCP and carries raw bridged bytes.
# Anything Zephyr prints there would corrupt the AST2700 stream, so keep it silent.
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_BOOT_BANNER=n
CONFIG_PRINTK=n
CONFIG_LOG=n
CONFIG_SHELL=n

# LED heartbeat so you can tell the bridge is alive.
CONFIG_GPIO=y

CONFIG_MAIN_STACK_SIZE=1024
